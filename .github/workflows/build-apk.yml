# ساخت خودکار APK در فضای ابری گیت‌هاب (بدون نیاز به هیچ ابزاری روی رایانه‌ی شما)
#
# طرز استفاده:
#   ۱) این پوشه (.github) را همراه پروژه در مخزن گیت‌هاب بگذارید
#   ۲) تب Actions → workflow «ساخت APK» → دکمه‌ی Run workflow
#   ۳) پس از ۵ تا ۱۰ دقیقه، APK را از بخش Artifacts دانلود کنید
name: ساخت APK

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "نام بسته (applicationId) — خالی بگذارید تا مقدار پیش‌فرض پروژه استفاده شود"
        required: false
        default: "com.iranamap.real"
      build_type:
        description: "نوع ساخت"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

jobs:
  build:
    name: ساخت ${{ github.event.inputs.build_type || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: کش Gradle
        uses: gradle/actions/setup-gradle@v3

      # نصب مستقیم بسته‌های لازم. (به‌جای android-actions/setup-android که با
      # cmdline-tools جدید روی بسته‌ی حذف‌شده‌ی «tools» شکست می‌خورد.)
      - name: آماده‌سازی Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKM" ] && [ -x "$SDK/tools/bin/sdkmanager" ]; then SDKM="$SDK/tools/bin/sdkmanager"; fi
          if [ -z "$SDKM" ] && command -v sdkmanager >/dev/null 2>&1; then SDKM="$(command -v sdkmanager)"; fi
          if [ -z "$SDKM" ]; then
            echo "sdkmanager پیدا نشد؛ نصب cmdline-tools ..."
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
            SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SDKM"
          echo "SDKMANAGER=$SDKM" >> "$GITHUB_ENV"

          set +e
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1
          set -e

          # فقط بسته‌هایی را نصب می‌کنیم که واقعاً لازم‌اند
          "$SDKM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "--- محتوای SDK:"
          ls "$SDK/platforms" "$SDK/build-tools" || true

      - name: آماده‌سازی موتور صدا (sherpa-onnx)
        run: |
          chmod +x gradlew scripts/*.sh
          bash scripts/fetch_models.sh
          ls -lh app/libs/sherpa-onnx.aar

      - name: اعتبارسنجی ایستا
        run: python3 tools/validate_project.py

      - name: آزمون‌های واحد
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: ساخت APK
        env:
          APP_ID: ${{ github.event.inputs.app_id }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -euo pipefail
          ARGS="--no-daemon -Dorg.gradle.jvmargs=-Xmx3072m"
          if [ -n "${APP_ID:-}" ]; then ARGS="$ARGS -PappId=$APP_ID"; fi
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew $ARGS assembleRelease
          else
            ./gradlew $ARGS assembleDebug
          fi

      - name: نام‌گذاری خروجی
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: بارگذاری APK به‌عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IranAmap-APK
          path: artifacts/*.apk
          retention-days: 30

      - name: بارگذاری گزارش آزمون‌ها (در صورت شکست)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore
