name: Android emulator smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'scripts/emulator_smoke.sh'
      - '.github/workflows/android-smoke.yml'

jobs:
  emulator:
    name: Emulator API 30 (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Enable KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo 'KVM is unavailable; emulator may be slow.'
          fi
      - name: Prepare offline speech dependency
        run: |
          chmod +x gradlew scripts/*.sh
          bash scripts/fetch_models.sh
      - name: Run app and instrumentation tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator_smoke.sh
      - name: Upload emulator reports and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-report
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            smoke-artifacts/
          retention-days: 14
          if-no-files-found: warn
